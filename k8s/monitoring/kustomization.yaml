apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# kubectl apply -k k8s/monitoring/   (deploy k8s/ first; see scripts/deploy_monitoring.sh)
resources:
  - namespace.yaml
  - prometheus-rbac.yaml
  - prometheus.yaml
  - grafana.yaml
  - ingress.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
      - alerts.yml
  - name: grafana-datasources
    namespace: monitoring
    files:
      - datasources.yaml=grafana-datasources.yml
  - name: grafana-dashboard-provider
    namespace: monitoring
    files:
      - provider.yaml=grafana-dashboard-provider.yml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - heart-api.json=dashboards/heart-api.json
