groups:
  - name: heart-api
    rules:
      - alert: HeartApiDown
        expr: sum(up{job="heart-api"}) < 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "No heart-api pod is being scraped successfully"

      - alert: HeartApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="heart-api", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="heart-api"}[5m])), 1e-9) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of API requests are failing (5xx)"

      - alert: HeartApiSlowPredictions
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="heart-api", path="/predict"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 /predict latency above 500 ms"

      - alert: HeartApiPredictionDrift
        expr: |
          (sum(rate(prediction_probability_disease_sum[15m])) / clamp_min(sum(rate(prediction_probability_disease_count[15m])), 1e-9))
            > 0.75
        for: 5m
        labels: {severity: info}
        annotations:
          summary: "Mean predicted disease probability is unusually high (possible input drift)"
