[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", "mlruns", "reports_tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
